  #gate a.back { display: inline-block; margin-top: 28px; color: #8a877f; text-decoration: none; font-size: 13px; }
  #gate a.back:hover { color: #c8c5bc; }

  :root { color-scheme: dark; }

  .reader-toggle:hover { border-color: #55534a; }
  .reader-toggle[aria-expanded="true"] { border-color: #c8c5bc; background: #22221f; }
  .reader-body { flex: 1; min-height: 0; display: flex; position: relative; background: #181817; }
  .reader-backdrop { display: none; }
  #reader-side {

    font-size: 14px; font-weight: 600; letter-spacing: 1px;

  #reader-close {
    font: inherit; font-size: 13px; font-weight: 400; letter-spacing: 0;
    color: #8a877f; background: transparent; border: 0; padding: 4px 2px; cursor: pointer;

  .reader-list { flex: 1; min-height: 0; overflow: auto; padding: 0 12px 12px; overscroll-behavior: contain; }
  #reader-app .reader-list .day { margin: 14px 0 8px; font-size: 13px; font-weight: 600; color: #c8c5bc; }
  #reader-app .entry .item {
    display: flex; align-items: center; background: #22221f; border: 1px solid #33322e;
    border-radius: 10px; padding: 10px 12px; margin: 0 0 8px;
    text-decoration: none; color: inherit; min-width: 0;
  }
  #reader-app .entry .item h2 {
    font-size: 14px; font-weight: 600; line-height: 1.35;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  #reader-app .entry .item.is-active { border-color: #e8e6e1; background: #2a2926; }
  #reader-app .entry.is-read .item h2 { color: #c8c5bc; }
  .reader-note { color: #8a877f; font-size: 14px; line-height: 1.6; padding: 4px 2px 8px; }
  .reader-all {
    flex: none; display: block; text-align: center; padding: 14px 12px;
    color: #c8c5bc; text-decoration: none; border-top: 1px solid #33322e; font-size: 14px;
  }
  .reader-all:hover { color: #e8e6e1; }
  #reader-frame { flex: 1; min-width: 0; width: 100%; height: 100%; border: 0; background: #181817; }
  #reader-frame[hidden] { display: none !important; }
  .reader-empty {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    color: #8a877f; font-size: 15px; padding: 24px;
  }
  .reader-empty[hidden] { display: none !important; }
  .reader-empty a { color: #c8c5bc; }
  @media (max-width: 759px) {
    #reader-side {
      position: fixed; z-index: 21; top: 48px; bottom: 0; left: 0;
      width: min(86vw, 320px); border-right: 1px solid #33322e;
      box-shadow: 8px 0 24px rgba(0,0,0,.45);
    }
    .reader-backdrop:not([hidden]) {
      display: block; position: fixed; z-index: 20; top: 48px; right: 0; bottom: 0;
      left: min(86vw, 320px); background: rgba(0,0,0,.45); border: 0; padding: 0; cursor: pointer;
    }
  }
  [hidden] { display: none !important; }

<body>

  <div id="gate">
    <div class="gate">
      <h1>这一期要密码</h1>
      <p class="tip">内容是加密存放的，密码对了才解得开。这台设备记 30 天，期间不用再输。</p>
      <form id="f">
        <input id="pw" type="password" autocomplete="current-password" placeholder="密码" required>
        <button id="go" type="submit">打开</button>
      </form>
      <p class="msg" id="msg"></p>
      <a class="back" href="../">← 返回首页</a>
    </div>
  </div>

  <div id="reader-app" hidden>
    <header class="reader-bar">
      <a class="reader-home" href="../">← 返回</a>
      <button type="button" id="reader-toggle" aria-expanded="false" aria-controls="reader-side">往期</button>
      <h1 class="reader-col" id="reader-col"></h1>
    </header>
    <div class="reader-body">
      <button type="button" id="reader-backdrop" class="reader-backdrop" hidden aria-label="关闭往期"></button>
      <aside id="reader-side" aria-label="往期" hidden>
        <div class="reader-side-head">
          <span>往期</span>
          <button type="button" id="reader-close">关闭</button>
        </div>
        <div id="reader-list" class="reader-list"></div>
        <a id="reader-all" class="reader-all" href="./list.html">查看全部</a>
      </aside>
      <p id="reader-empty" class="reader-empty" hidden>这一栏还没有期号。 <a href="../">回首页</a></p>
      <iframe id="reader-frame" title="本期正文" hidden></iframe>
    </div>
  </div>

      .then(unlockWith)
      .then(function () { localStorage.setItem(SLOT, JSON.stringify({ k: o.k, t: Date.now() })); })
      ['catch'](function () { localStorage.removeItem(SLOT); });
  })();

  var tg = document.getElementById('reader-toggle');
  var cl = document.getElementById('reader-close');
  var bd = document.getElementById('reader-backdrop');
  if (tg) tg.addEventListener('click', function () { setOpen(tg.getAttribute('aria-expanded') !== 'true'); });
  if (cl) cl.addEventListener('click', function () { setOpen(false); if (tg) tg.focus(); });
  if (bd) bd.addEventListener('click', function () { setOpen(false); if (tg) tg.focus(); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var side = document.getElementById('reader-side');
    if (side && !side.hidden) { setOpen(false); if (tg) tg.focus(); }
  });
})();
</script>
</body>
</html>
