      var f = (location.hash || '').slice(1);
      if (f && f !== cur) openIssue(f);
    });
  }
  function decryptManifest(k) {
    var raw = b64(DATA);
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(16, 28) }, k, raw.slice(28))
      .then(function (plain) { return JSON.parse(new TextDecoder().decode(plain)); });
  }
  function unlockWith(k) {
    key = k;
    return decryptManifest(k).then(function (m) { enter(m); });
  }

  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    btn.disabled = true;
    msg.textContent = '解开中…';
    var raw = b64(DATA);
    keyFrom(document.getElementById('pw').value, raw.slice(0, 16))
      .then(function (k) { return unlockWith(k).then(function () { return saveKey(k); }); })
      ['catch'](function () { msg.textContent = '密码不对。'; btn.disabled = false; });
  });

  (function restore() {
    var saved = localStorage.getItem(SLOT), o;
    if (!saved) return;
    try { o = JSON.parse(saved); } catch (e) { localStorage.removeItem(SLOT); return; }
    if (!o || !o.k || !o.t || Date.now() - o.t > TTL) { localStorage.removeItem(SLOT); return; }
    crypto.subtle.importKey('raw', b64(o.k), { name: 'AES-GCM' }, true, ['decrypt'])
      .then(unlockWith)
      .then(function () { localStorage.setItem(SLOT, JSON.stringify({ k: o.k, t: Date.now() })); })
      ['catch'](function () { localStorage.removeItem(SLOT); });
  })();

  var tg = document.getElementById('reader-toggle');
  var cl = document.getElementById('reader-close');
  var bd = document.getElementById('reader-backdrop');
  if (tg) tg.addEventListener('click', function () { setOpen(tg.getAttribute('aria-expanded') !== 'true'); });
  if (cl) cl.addEventListener('click', function () { setOpen(false); if (tg) tg.focus(); });
  if (bd) bd.addEventListener('click', function () { setOpen(false); if (tg) tg.focus(); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var side = document.getElementById('reader-side');
    if (side && !side.hidden) { setOpen(false); if (tg) tg.focus(); }
  });
})();
</script>
