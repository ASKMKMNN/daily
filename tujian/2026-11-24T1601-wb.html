<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  a:focus-visible, button:focus-visible { outline: 2px solid #c8c5bc; outline-offset: 3px; border-radius: 4px; }
  #gate {
    background: #181817; color: #e8e6e1;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  #gate .gate { width: 100%; max-width: 380px; }
  #gate h1 { font-size: 21px; font-weight: 600; letter-spacing: 1px; margin-bottom: 10px; }
  #gate .tip { color: #8a877f; font-size: 14px; line-height: 1.7; margin-bottom: 24px; }
  #gate input {
    width: 100%; padding: 14px 16px; font-size: 16px;
    background: #22221f; color: #e8e6e1;
    border: 1px solid #33322e; border-radius: 12px;
    font-family: inherit; outline: none;
  }
  #gate input:focus { border-color: #55534a; outline: 2px solid #55534a; outline-offset: 2px; }
  #gate button[type=submit] {
    width: 100%; margin-top: 12px; padding: 14px;
    background: #2c2b27; color: #e8e6e1; border: 1px solid #3d3c35;
    border-radius: 12px; font-size: 15px; font-family: inherit; cursor: pointer;
    transition: border-color .15s ease;
  }
  #gate button[type=submit]:hover { border-color: #6a6860; }
  #gate button[type=submit]:disabled { opacity: .45; cursor: default; }
  #gate .msg { margin-top: 16px; font-size: 13px; min-height: 20px; color: #c98d7d; }
  #gate a.back { display: inline-block; margin-top: 28px; color: #8a877f; text-decoration: none; font-size: 13px; }
  #gate a.back:hover { color: #c8c5bc; }

  html, body { overflow-x: clip; }
</style>

  var SLOT = 'daily-key:v2';
  var TTL = 2592000000;
  var ITER = 120000;
  var LIST = false;
  var msg = document.getElementById('msg');
  var btn = document.getElementById('go');
  var form = document.getElementById('f');

  function b64(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function keyFrom(pass, salt) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:salt, iterations:ITER, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, true, ['decrypt']);
  }
  function mount(html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    document.documentElement.lang = doc.documentElement.getAttribute('lang') || 'zh-CN';
    document.head.innerHTML = doc.head.innerHTML;
    document.body.removeAttribute('class');
    document.body.removeAttribute('style');
    var bc = doc.body.getAttribute('class'), bs = doc.body.getAttribute('style');
    if (bc) document.body.className = bc;
    if (bs) document.body.setAttribute('style', bs);
    document.body.innerHTML = doc.body.innerHTML;
    var list = document.querySelectorAll('body script');
    for (var i = 0; i < list.length; i++) {
      var old = list[i], s = document.createElement('script');
      for (var j = 0; j < old.attributes.length; j++) {
        s.setAttribute(old.attributes[j].name, old.attributes[j].value);
      }
      s.textContent = old.textContent;
      old.parentNode.replaceChild(s, old);
    }
    if (LIST) {
      var links = document.querySelectorAll('a.item');
      for (var k = 0; k < links.length; k++) {
        var href = (links[k].getAttribute('href') || '').split('#')[0];
        if (/\.html$/.test(href) && href.indexOf('index.html') < 0) {
          links[k].setAttribute('href', './index.html#' + href);
        }
      }
      var back = document.querySelector('a.back');
      if (back) { back.setAttribute('href', './index.html'); back.textContent = '← 返回阅读'; }
    }
    window.scrollTo(0, 0);
  }
  async function open(key) {
    var raw = b64(DATA);
    var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:raw.slice(16,28)}, key, raw.slice(28));
    window.__DAILY_KEY = key;
    mount(new TextDecoder().decode(plain));
  }
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    btn.disabled = true;
    msg.className = 'msg';
    msg.textContent = '解开中…';
    try {
      var raw = b64(DATA);
      var key = await keyFrom(document.getElementById('pw').value, raw.slice(0,16));
      await open(key);
      var kraw = await crypto.subtle.exportKey('raw', key);
      localStorage.setItem(SLOT, JSON.stringify({
        k: btoa(String.fromCharCode.apply(null, new Uint8Array(kraw))), t: Date.now()
      }));
    } catch (err) {
      msg.textContent = '密码不对。';
      btn.disabled = false;
    }
  });
  (async function () {
    var saved = localStorage.getItem(SLOT);
    if (!saved) return;
    var o;
    try { o = JSON.parse(saved); } catch (e) { localStorage.removeItem(SLOT); return; }
    if (!o || !o.k || !o.t || Date.now() - o.t > TTL) { localStorage.removeItem(SLOT); return; }
    try {
      var key = await crypto.subtle.importKey('raw', b64(o.k), {name:'AES-GCM'}, true, ['decrypt']);
      await open(key);
      localStorage.setItem(SLOT, JSON.stringify({ k: o.k, t: Date.now() }));
    } catch (e) {
      localStorage.removeItem(SLOT);
    }
  })();
})();
