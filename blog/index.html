<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日博客 · 每日情报</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow-x: clip; }
  a:focus-visible { outline: 2px solid #c8c5bc; outline-offset: 3px; border-radius: 4px; }
  body {
    background: #181817;
    color: #e8e6e1;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding: 48px 20px;
  }
  .hero {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    margin: 22px 0 36px;
  }
  .hero img { width: 100%; height: 200px; object-fit: cover; display: block; opacity: .55; }
  .hero .hero-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 24px 26px;
    background: linear-gradient(180deg, rgba(24,24,23,0) 30%, rgba(24,24,23,.85) 100%);
  }
  .hero h1 { font-size: 26px; letter-spacing: 2px; margin: 0; }
  .hero p { margin: 6px 0 0; color: #c8c5bc; font-size: 14px; }
  @media (max-width: 640px) { .hero img { height: 150px; } }
  .hero-full {
    position: relative;
    height: 280px;
    border-radius: 20px;
    overflow: hidden;
    margin: 22px 0 36px;
    background-color: #22221f;
    background-position: center 34%;
    background-size: cover;
    background-repeat: no-repeat;
  }
  .hero-full img {
    width: 100%;
    height: 280px;
    object-fit: cover;
    object-position: center 34%;
    display: block;
  }
  .hero-full .hero-copy {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 44px;
    background: linear-gradient(90deg,
      rgba(24,24,23,.93) 0%, rgba(24,24,23,.82) 32%,
      rgba(24,24,23,.42) 55%, rgba(24,24,23,.06) 82%);
  }
  .hero-full h1 { font-size: 34px; letter-spacing: 3px; margin: 0; }
  .hero-full p { margin: 12px 0 0; color: #d2cfc6; font-size: 15px; }
  @media (max-width: 640px) {
    .hero-full, .hero-full img { height: 190px; }
    .hero-full img {
    width: 100%;
    height: 280px;
    object-fit: cover;
    object-position: center 34%;
    display: block;
  }
  .hero-full .hero-copy { padding: 0 22px; }
    .hero-full h1 { font-size: 25px; letter-spacing: 2px; }
    .hero-full p { font-size: 13.5px; margin-top: 8px; }
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  a.back { color: #8a877f; text-decoration: none; font-size: 14px; }
  a.back:hover { color: #c8c5bc; }
  h1 { font-size: 26px; margin: 18px 0 6px; }
  .sub { color: #8a877f; font-size: 14px; margin-bottom: 36px; }

  a.item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    background: #22221f;
    border: 1px solid #33322e;
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 14px;
    text-decoration: none;
    color: inherit;
    transition: border-color .15s ease, transform .15s ease;
  }
  a.item:hover { border-color: #55534a; transform: translateY(-2px); }
  a.item h2 { font-size: 17px; font-weight: 600; }
  a.item span { color: #8a877f; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .newest { border-color: #55534a; }
  .newest h2::after {
    content: "最新";
    margin-left: 8px;
    font-size: 12px;
    font-weight: 400;
    color: #c8c5bc;
    border: 1px solid #3d3c35;
    border-radius: 999px;
    padding: 2px 8px;
    vertical-align: 2px;
  }
  .none { color: #8a877f; font-size: 14px; }

</style>
