<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日情报 · 每日更新</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #181817;
    color: #e8e6e1;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding: 0 20px 64px;
  }
  .hero {
    position: relative;
    max-width: 1080px;
    margin: 0 auto;
    border-radius: 0 0 20px 20px;
    overflow: hidden;
  }
  .hero img { width: 100%; display: block; opacity: .55; }
  @media (max-width: 640px) { .hero img { height: 230px; object-fit: cover; } }
  .hero .hero-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 32px 30px 30px;
    background: linear-gradient(180deg, rgba(24,24,23,0) 30%, rgba(24,24,23,.85) 100%);
  }
  .hero h1 { font-size: 34px; letter-spacing: 3px; }
  .hero p { margin-top: 10px; color: #c8c5bc; font-size: 14.5px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    max-width: 1080px;
    width: 100%;
    margin: 28px auto 0;
  }
  @media (min-width: 760px) {
    .grid { grid-template-columns: 1fr 1fr; gap: 16px 18px; }
  }
  a.card {
    position: relative;
    display: block;
    height: 188px;
    background: #181817;
    border: 1px solid #33322e;
    border-radius: 14px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    min-width: 0;
    transition: border-color .15s ease;
  }
  @media (min-width: 760px) {
    a.card { height: 192px; }
  }
  a.card::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 50%;
    background: linear-gradient(180deg, rgba(24,24,23,0) 0%, rgba(24,24,23,.16) 26%, rgba(24,24,23,.62) 58%, rgba(24,24,23,.9) 80%, rgba(24,24,23,.94) 100%);
    pointer-events: none;
  }
  a.card:hover { border-color: #55534a; }
  a.card:focus-visible {
    outline: 2px solid #c8c5bc;
    outline-offset: 3px;
  }
  @media (prefers-reduced-motion: reduce) {
    a.card { transition: none; }
  }
  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 42%;
    display: block;
  }
  .card:nth-child(2) img { object-position: center 84%; }
  .card:nth-child(3) img { object-position: center 18%; }
  .card .body {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: end;
    column-gap: 10px;
    row-gap: 2px;
    padding: 0 16px 12px;
    min-width: 0;
  }
  .card h2 {
    grid-column: 1 / -1;
    font-size: 20px;
    font-weight: 600;
    line-height: 1.25;
  }
  .card p {
    grid-column: 1;
    min-width: 0;
    font-size: 15.5px;
    color: #d4d0c6;
    line-height: 1.4;
  }
  .card .tag {
    grid-column: 2;
    justify-self: end;
    align-self: end;
    margin: 0;
    max-width: 100%;
    white-space: nowrap;
    font-size: 12.5px;
    line-height: 1.35;
    color: #e4e1d8;
    border: 1px solid rgba(232,230,225,.28);
    border-radius: 999px;
    padding: 2px 8px;
  }
  footer {
    max-width: 1080px;
    margin: 32px auto 0;
    color: #b7b3a8;
    font-size: 13px;
    line-height: 1.6;
    text-align: center;
  }
</style>
<link rel="icon" type="image/png" sizes="48x48" href="/daily/favicon-48.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="/daily/favicon-32.png?v=4">
<link rel="apple-touch-icon" href="/daily/apple-touch-icon.png?v=4">

</head>
<body>
  <div class="hero">
    <img src="assets/hero.jpg" alt="英伟达 Rubin GPU 渲染图">
    <div class="hero-text">
      <h1>每日情报</h1>
      <p>午报 · 晚报 · 图鉴 · 博客 · 周末推荐</p>

  <main class="grid">
    <a class="card" href="wubao/">
      <img src="assets/card-wubao.jpg" alt="星宇航空悉尼航拍">
      <div class="body">

        <p>每天中午出刊，中午饭后来一份。</p>
        <span class="tag">更新见栏目内</span>

    <a class="card" href="wanbao/">
      <img src="assets/card-wanbao.jpg" alt="英国航空客机">

        <span class="tag">更新见栏目内</span>

    </a>
    <a class="card" href="tujian/">
      <img src="assets/card-tujian.jpg" alt="Julia Fox 街拍">
      <div class="body">

<script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("/daily/sw.js")})}</script>
<script>
(function () {
  var PUBLIC = { "wubao/": 1, "wanbao/": 1, "blog/": 1 };
  var FALLBACK = "更新见栏目内";
  var HREF = /^(?:\.\/)?(\d{4})-(\d{2})-(\d{2})T\d{4}-[A-Za-z0-9]+\.html$/;

  function beijing(now) {
    var t = new Date(now.getTime() + 8 * 60 * 60 * 1000);
    return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate() };
  }
  function realDay(y, m, d) {
    var dt = new Date(Date.UTC(y, m - 1, d));
    return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
  }
  function latest(html) {
    var doc = new DOMParser().parseFromString(html, "text/html");
    var best = null;
    var links = doc.querySelectorAll("a[href]");
    for (var i = 0; i < links.length; i++) {
      var m = HREF.exec(links[i].getAttribute("href") || "");
      if (!m) continue;
      var y = +m[1], mo = +m[2], d = +m[3];
      if (!realDay(y, mo, d)) continue;
      var key = y * 10000 + mo * 100 + d;
      if (!best || key > best.key) best = { y: y, m: mo, d: d, key: key };
    }
    return best;
  }
  function textFor(best, today) {
    if (!best) return FALLBACK;
    if (best.y === today.y && best.m === today.m && best.d === today.d) return "今日已更新";
    if (best.y === today.y) return "最新" + best.m + "月" + best.d + "日";
    return "最新" + best.y + "年" + best.m + "月" + best.d + "日";
  }

  var cards = document.querySelectorAll("main a.card");
  for (var i = 0; i < cards.length; i++) {
    (function (card) {
      var href = card.getAttribute("href");
      var tag = card.querySelector(".tag");
      if (!tag || !PUBLIC[href]) return;
      fetch(href, { credentials: "same-origin", cache: "no-store" })
        .then(function (res) {
          if (!res.ok) throw new Error("bad");
          return res.text();
        })
        .then(function (html) {
          if (!html || html.length > 500000) throw new Error("bad");
          tag.textContent = textFor(latest(html), beijing(new Date()));
        })
        .catch(function () {
          tag.textContent = FALLBACK;
        });
    })(cards[i]);
  }
})();
</script>
</body>
</html>
