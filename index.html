<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日情报 · 每日更新</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #181817;
    color: #e8e6e1;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding: 0 20px 56px;
  }
  .hero {
    position: relative;
    max-width: 920px;
    margin: 0 auto;
    border-radius: 0 0 20px 20px;
    overflow: hidden;
  }
  .hero img { width: 100%; display: block; opacity: .55; }
  @media (max-width: 640px) { .hero img { height: 230px; object-fit: cover; } }
  .hero .hero-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 32px 30px 30px;
    background: linear-gradient(180deg, rgba(24,24,23,0) 30%, rgba(24,24,23,.85) 100%);
  }
  .hero h1 { font-size: 34px; letter-spacing: 3px; }
  .hero p { margin-top: 10px; color: #c8c5bc; font-size: 14.5px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 22px;
    max-width: 920px;
    width: 100%;
    margin: 36px auto 0;
  }
  a.card {
    display: block;
    background: #22221f;
    border: 1px solid #33322e;
    border-radius: 16px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform .15s ease, border-color .15s ease;
  }
  a.card:hover { transform: translateY(-3px); border-color: #55534a; }
  .card img { width: 100%; height: 150px; object-fit: cover; display: block; opacity: .85; }
  .card .body { padding: 20px 20px 22px; }
  .card h2 { font-size: 19px; margin-bottom: 8px; }
  .card p { font-size: 13.5px; color: #9b988f; line-height: 1.6; }
  .card .tag {
    display: inline-block;
    margin-top: 14px;
    font-size: 12px;
    color: #c8c5bc;
    border: 1px solid #3d3c35;
    border-radius: 999px;
    padding: 3px 10px;
  }
  footer { max-width: 920px; margin: 48px auto 0; color: #5c5a53; font-size: 12.5px; text-align: center; }
</style>
<link rel="icon" type="image/png" sizes="48x48" href="/daily/favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="/daily/favicon-32.png">
<link rel="apple-touch-icon" href="/daily/apple-touch-icon.png">
<link rel="manifest" href="/daily/manifest.json">
<meta name="theme-color" content="#181817">
</head>
<body>
  <div class="hero">
    <img src="assets/hero.jpg" alt="英伟达 Rubin GPU 渲染图">
    <div class="hero-text">
      <h1>每日情报</h1>
      <p>午报 · 晚报 · 图鉴</p>
    </div>
  </div>

  <main class="grid">
    <a class="card" href="wubao/">
      <img src="assets/card-wubao.jpg" alt="星宇航空悉尼航拍">
      <div class="body">
        <h2>午报</h2>
        <p>每天中午出刊，中午饭后来一份。</p>
        <span class="tag">每日约 11:25 更新</span>
      </div>
    </a>
    <a class="card" href="wanbao/">
      <img src="assets/card-wanbao.jpg" alt="英国航空客机">
      <div class="body">
        <h2>晚报</h2>
        <p>每天傍晚出刊，收工路上慢慢翻。</p>
        <span class="tag">每日约 18:25 更新</span>
      </div>
    </a>
    <a class="card" href="tujian/">
      <img src="assets/card-tujian.jpg" alt="Julia Fox 街拍">
      <div class="body">
        <h2>每日图鉴</h2>
        <p>每天的图鉴合集，一期不落。</p>
        <span class="tag">每日约 19:00 出刊</span>
      </div>
    </a>
  </main>

  <footer>由灵光代编 · 内容仅代表个人兴趣</footer>
<script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("/daily/sw.js")})}</script>
</body>
</html>
