<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日情报 · 每日更新</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #181817;
    color: #e8e6e1;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding: 0 20px 64px;
  }
  .hero {
    position: relative;
    max-width: 1080px;
    margin: 0 auto;
    border-radius: 0 0 20px 20px;
    overflow: hidden;
  }
  .hero img { width: 100%; display: block; opacity: .55; }
  @media (max-width: 640px) { .hero img { height: 230px; object-fit: cover; } }
  .hero .hero-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 32px 30px 30px;
    background: linear-gradient(180deg, rgba(24,24,23,0) 30%, rgba(24,24,23,.85) 100%);
  }
  .hero h1 { font-size: 34px; letter-spacing: 3px; }
  .hero p { margin-top: 10px; color: #c8c5bc; font-size: 14.5px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    max-width: 1080px;
    width: 100%;
    margin: 28px auto 0;
  }
  @media (min-width: 760px) {
    .grid { grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  }
  a.card {
    display: grid;
    grid-template-columns: 108px minmax(0, 1fr);
    align-items: stretch;
    background: #22221f;
    border: 1px solid #33322e;
    border-radius: 14px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    min-width: 0;
    transition: border-color .15s ease;
  }
  @media (min-width: 760px) {
    a.card { grid-template-columns: 146px minmax(0, 1fr); }
  }
  a.card:hover { border-color: #55534a; }
  a.card:focus-visible {
    outline: 2px solid #c8c5bc;
    outline-offset: 3px;
  }
  @media (prefers-reduced-motion: reduce) {
    a.card { transition: none; }
  }
  .card img {
    width: 100%;
    height: 100%;
    min-height: 96px;
    object-fit: cover;
    display: block;
    opacity: .85;
  }
  .card .body {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    align-content: center;
    gap: 2px 10px;
    padding: 12px 14px;
    min-width: 0;
  }
  .card h2 {
    order: 1;
    font-size: 20px;
    font-weight: 600;
    line-height: 1.3;
  }
  .card p {
    order: 3;
    flex: 1 0 100%;
    font-size: 16px;
    color: #b7b3a8;
    line-height: 1.45;
  }
  .card .tag {
    order: 2;
    margin-left: auto;
    font-size: 13px;
    line-height: 1.35;
    color: #c8c5bc;
    border: 1px solid #3d3c35;
    border-radius: 999px;
    padding: 2px 8px;
  }
  footer {
    max-width: 1080px;
    margin: 36px auto 0;
    color: #b7b3a8;
    font-size: 13px;
    line-height: 1.6;
    text-align: center;
  }
</style>
<link rel="icon" type="image/png" sizes="48x48" href="/daily/favicon-48.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="/daily/favicon-32.png?v=4">
<link rel="apple-touch-icon" href="/daily/apple-touch-icon.png?v=4">
<link rel="manifest" href="/daily/manifest.json">
<meta name="theme-color" content="#181817">
</head>
<body>
  <div class="hero">
    <img src="assets/hero.jpg" alt="英伟达 Rubin GPU 渲染图">
    <div class="hero-text">
      <h1>每日情报</h1>
      <p>午报 · 晚报 · 图鉴 · 博客 · 周末推荐</p>
    </div>
  </div>

  <main class="grid">
    <a class="card" href="wubao/">
      <img src="assets/card-wubao.jpg" alt="星宇航空悉尼航拍">
      <div class="body">
        <h2>午报</h2>
        <p>每天中午出刊，中午饭后来一份。</p>
        <span class="tag">每日约 11:25 更新</span>
      </div>
    </a>
    <a class="card" href="wanbao/">
      <img src="assets/card-wanbao.jpg" alt="英国航空客机">
      <div class="body">
        <h2>晚报</h2>
        <p>每天傍晚出刊，收工路上慢慢翻。</p>
        <span class="tag">每日约 18:25 更新</span>
      </div>
    </a>
    <a class="card" href="tujian/">
      <img src="assets/card-tujian.jpg" alt="Julia Fox 街拍">
      <div class="body">
        <h2>每日图鉴</h2>
        <p>每天的图鉴合集，一期不落。</p>
        <span class="tag">每日约 18:45 出刊</span>
      </div>
    </a>
    <a class="card" href="blog/">
      <img src="assets/card-blog4.jpg" alt="摊开的书">
      <div class="body">
        <h2>每日博客</h2>
        <p>每天一篇值得读完的。</p>
        <span class="tag">每日更新</span>
      </div>
    </a>
    <a class="card" href="weekly/">
      <img src="assets/card-weekly.jpg" alt="周末的沙发与咖啡">
      <div class="body">
        <h2>周末推荐</h2>
        <p>每周五出刊，管住七天看什么玩什么。</p>
        <span class="tag">每周五约 11:00 更新</span>
      </div>
    </a>
  </main>

  <footer>由灵光代编 · 内容仅代表个人兴趣</footer>
<script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("/daily/sw.js")})}</script>
</body>
</html>
